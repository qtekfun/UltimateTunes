components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: query
      name: apiKey
      description: '[OS] API key. Must not be combined with `u`, `p`, `t`, `s` (error 43).'
    username:
      type: apiKey
      in: query
      name: u
      description: Username, only with `p` (legacy clients).
    password:
      type: apiKey
      in: query
      name: p
      description: An API key of that user used as password, in clear or `enc:` + hex.
  parameters:
    v:
      name: v
      in: query
      required: false
      schema:
        type: string
        examples:
        - 1.16.1
      description: Protocol version of the client. Required by Subsonic, tolerated when absent. A major version
        above 1 gives error 30.
    c:
      name: c
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
        examples:
        - UltimateTunes-Android
      description: Client name. Required by Subsonic, tolerated when absent (`unknown`). Stored as `changedBy`/history
        client.
    f:
      name: f
      in: query
      required: false
      schema:
        type: string
        enum:
        - json
        - xml
        default: xml
      description: Response format. `jsonp` is not supported (error 0).
    t:
      name: t
      in: query
      required: false
      schema:
        type: string
      description: 'Token auth (md5(password+salt)). **Always refused with error 42**: only Argon2id hashes are
        stored. Present here so the refusal is part of the contract.'
    s:
      name: s
      in: query
      required: false
      schema:
        type: string
      description: Salt for token auth. Refused with `t` (error 42).
  responses:
    RateLimited:
      description: Rate limited or temporarily locked out. Envelope with code 0.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FailedResponse'
          example:
            subsonic-response:
              status: failed
              version: 1.16.1
              type: UltimateTunes
              serverVersion: 0.1.0
              openSubsonic: true
              error:
                code: 0
                message: Too many requests, retry in 60 seconds
        application/xml:
          schema:
            type: string
          example: |
            <?xml version="1.0" encoding="UTF-8"?>
            <subsonic-response xmlns="http://subsonic.org/restapi" status="failed" version="1.16.1" type="UltimateTunes" serverVersion="0.1.0" openSubsonic="true">
              <error code="0" message="Too many requests, retry in 60 seconds"/>
            </subsonic-response>
    NotImplemented:
      description: Router stub (PLAN T02) not implemented yet. Envelope with code 0.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FailedResponse'
          example:
            subsonic-response:
              status: failed
              version: 1.16.1
              type: UltimateTunes
              serverVersion: 0.1.0
              openSubsonic: true
              error:
                code: 0
                message: Not implemented
        application/xml:
          schema:
            type: string
          example: |
            <?xml version="1.0" encoding="UTF-8"?>
            <subsonic-response xmlns="http://subsonic.org/restapi" status="failed" version="1.16.1" type="UltimateTunes" serverVersion="0.1.0" openSubsonic="true">
              <error code="0" message="Not implemented"/>
            </subsonic-response>
    StreamFailed:
      description: 'The download of this song failed (`stream`/`download` only): error 70 with HTTP 404, so a
        player retrying a cut stream sees a failed request (contracts/errors.md). Answered until the download is
        retried.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FailedResponse'
          example:
            subsonic-response:
              status: failed
              version: 1.16.1
              type: UltimateTunes
              serverVersion: 0.1.0
              openSubsonic: true
              error:
                code: 70
                message: Download failed
        application/xml:
          schema:
            type: string
          example: |
            <?xml version="1.0" encoding="UTF-8"?>
            <subsonic-response xmlns="http://subsonic.org/restapi" status="failed" version="1.16.1" type="UltimateTunes" serverVersion="0.1.0" openSubsonic="true">
              <error code="70" message="Download failed"/>
            </subsonic-response>
    TooManyListeners:
      description: Listener cap of an in-flight `yt:` stream reached (per job or per API key). Envelope with code 0.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FailedResponse'
          example:
            subsonic-response:
              status: failed
              version: 1.16.1
              type: UltimateTunes
              serverVersion: 0.1.0
              openSubsonic: true
              error:
                code: 0
                message: Too many listeners for this song, retry in 5 seconds
        application/xml:
          schema:
            type: string
          example: |
            <?xml version="1.0" encoding="UTF-8"?>
            <subsonic-response xmlns="http://subsonic.org/restapi" status="failed" version="1.16.1" type="UltimateTunes" serverVersion="0.1.0" openSubsonic="true">
              <error code="0" message="Too many listeners for this song, retry in 5 seconds"/>
            </subsonic-response>
    EnvelopeOnBinary:
      description: Error envelope instead of binary content.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FailedResponse'
          example:
            subsonic-response:
              status: failed
              version: 1.16.1
              type: UltimateTunes
              serverVersion: 0.1.0
              openSubsonic: true
              error:
                code: 70
                message: Song not found
        application/xml:
          schema:
            type: string
          example: |
            <?xml version="1.0" encoding="UTF-8"?>
            <subsonic-response xmlns="http://subsonic.org/restapi" status="failed" version="1.16.1" type="UltimateTunes" serverVersion="0.1.0" openSubsonic="true">
              <error code="70" message="Song not found"/>
            </subsonic-response>
  examples:
    failed_notFound:
      value:
        subsonic-response:
          status: failed
          version: 1.16.1
          type: UltimateTunes
          serverVersion: 0.1.0
          openSubsonic: true
          error:
            code: 70
            message: Song not found
    failed_notFound_xml:
      value: |
        <?xml version="1.0" encoding="UTF-8"?>
