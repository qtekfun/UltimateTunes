          license:
            valid: true
    getLicense_ok_xml:
      value: |
        <?xml version="1.0" encoding="UTF-8"?>
        <subsonic-response xmlns="http://subsonic.org/restapi" status="ok" version="1.16.1" type="UltimateTunes" serverVersion="0.1.0" openSubsonic="true">
          <license valid="true"/>
        </subsonic-response>
    getOpenSubsonicExtensions_ok:
      value:
        subsonic-response:
          status: ok
          version: 1.16.1
          type: UltimateTunes
          serverVersion: 0.1.0
          openSubsonic: true
          openSubsonicExtensions:
          - name: apiKeyAuthentication
            versions:
            - 1
          - name: formPost
            versions:
            - 1
          - name: songLyrics
            versions:
            - 1
