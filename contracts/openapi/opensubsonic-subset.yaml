  /rest/getCoverArt:
    get:
      tags:
      - media
      summary: Cover image
      description: |-
        Cover image. Library covers (`al-`, `ar-`, `pl-`) come from `/music`.
        Virtual ids (`yt:`, `ytalbum:`, `ytartist:`) return the catalog thumbnail, fetched only from the approved YouTube image hosts and cached on disk; error 70 when there is none or it fails the host/type/size rules (contracts/ids.md).
        v1 may ignore `size` and return the stored image unscaled (no image library is approved yet). `HEAD` is accepted (no body).
      parameters:
      - $ref: '#/components/parameters/v'
      - $ref: '#/components/parameters/c'
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/t'
      - $ref: '#/components/parameters/s'
      - name: id
        in: query
        required: true
        schema:
          type: string
        description: Cover art id (`al-`, `ar-`, `pl-` + UUID, or a virtual id). See contracts/ids.md.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 16
          maximum: 1200
        description: Requested longest side in pixels. A hint only, v1 may ignore it.
      responses:
        '200':
          description: The image (JPEG, PNG or WebP), or an error envelope.
          content:
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/webp:
              schema:
                type: string
                contentMediaType: image/webp
            application/json:
              schema:
                $ref: '#/components/schemas/FailedResponse'
              example:
                subsonic-response:
                  status: failed
                  version: 1.16.1
                  type: UltimateTunes
                  serverVersion: 0.1.0
                  openSubsonic: true
                  error:
                    code: 70
                    message: Cover art not found
            application/xml:
              schema:
                type: string
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <subsonic-response xmlns="http://subsonic.org/restapi" status="failed" version="1.16.1" type="UltimateTunes" serverVersion="0.1.0" openSubsonic="true">
                  <error code="70" message="Cover art not found"/>
