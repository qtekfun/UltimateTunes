  /rest/stream:
    get:
      tags:
      - media
      summary: Stream a song
      description: |-
        Never transcodes: the original file, in its own format. `HEAD` is accepted (same headers, no body).

        **Library songs** (and a `yt:` id once archived, served from the library file): `200` with `Content-Length` and `Accept-Ranges: bytes`; a `Range` request gets `206` with `Content-Range`, a range past the size `416`.

        **`yt:` id not archived yet (streaming while downloading, RF-05, SPEC §11).** The api requests the download (or joins the running one) and answers as soon as the first bytes exist, from the worker's progress reports (contracts/openapi/internal-worker.yaml):
