        <?xml version="1.0" encoding="UTF-8"?>
        <subsonic-response xmlns="http://subsonic.org/restapi" status="ok" version="1.16.1" type="UltimateTunes" serverVersion="0.1.0" openSubsonic="true"/>
  schemas:
    Error:
      type: object
      description: OpenSubsonic error. Codes and their mapping from `TunesError` are in `contracts/errors.md`.
      required:
      - code
      properties:
        code:
          type: integer
          enum:
          - 0
          - 10
          - 20
          - 30
          - 40
          - 41
          - 42
          - 43
          - 44
          - 50
          - 70
          description: |
            * 0: generic error (also rate limited, not implemented, upstream failure)
            * 10: required parameter is missing
            * 20: incompatible protocol version, client must upgrade
            * 30: incompatible protocol version, server must upgrade
            * 40: wrong username or password
            * 41: token authentication not supported (reserved, see errors.md)
            * 42: provided authentication mechanism not supported (token auth `t`/`s`)
            * 43: multiple conflicting authentication mechanisms provided
            * 44: invalid API key
            * 50: user is not authorized for the given operation
            * 70: the requested data was not found
        message:
          type: string
        helpUrl:
          type: string
          description: '[OS] URL with more context (e.g. how to create an API key).'
    SubsonicBase:
      type: object
      description: Fields present in every `subsonic-response`.
      required:
      - status
      - version
      - type
      - serverVersion
      - openSubsonic
      properties:
        status:
          type: string
          enum:
          - ok
          - failed
        version:
          type: string
          const: 1.16.1
          description: Subsonic REST API version implemented.
        type:
          type: string
          const: UltimateTunes
          description: '[OS] Server name.'
        serverVersion:
          type: string
          description: '[OS] Server version (root `VERSION` file).'
          examples:
          - 0.1.0
        openSubsonic:
          type: boolean
          const: true
          description: '[OS] Always true.'
    SubsonicFailure:
      description: Body of a failed `subsonic-response`.
      allOf:
      - $ref: '#/components/schemas/SubsonicBase'
      - type: object
        required:
        - status
        - error
        properties:
          status:
            const: failed
          error:
            $ref: '#/components/schemas/Error'
    FailedResponse:
      type: object
      required:
      - subsonic-response
      properties:
        subsonic-response:
          $ref: '#/components/schemas/SubsonicFailure'
    ReplayGain:
      type: object
      description: '[OS] ReplayGain computed by the worker with ffmpeg (RF-04). Always present on `Child` (empty
        object for external and not yet analysed songs). Album values only when the whole album is in the library.'
      properties:
        trackGain:
          type: number
          description: dB
        albumGain:
          type: number
          description: dB
        trackPeak:
          type: number
          minimum: 0
        albumPeak:
          type: number
          minimum: 0
        baseGain:
          type: number
          description: dB (Opus output gain). Omitted when 0.
    ItemGenre:
      type: object
      required:
      - name
      properties:
        name:
          type: string
    ArtistRef:
      type: object
      description: Minimal `ArtistID3` (only the required fields), used inside `Child` and `AlbumID3`.
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
    Child:
      type: object
      description: |-
        A song. Library songs have UUID ids. External songs (YouTube Music, not in the library yet) have `yt:<videoId>` ids, no `size`/`suffix`/`contentType`/`path`, `coverArt` = their own id and an empty `replayGain`. See contracts/ids.md.
        OpenSubsonic fields this server supports are always returned (empty value when unknown), as the OpenSubsonic spec requires, so they are listed as required here.
      required:
      - id
      - isDir
      - title
      - type
      - mediaType
      - isVideo
      - musicBrainzId
      - genres
      - artists
      - displayArtist
      - albumArtists
      - displayAlbumArtist
      - replayGain
      properties:
        id:
          type: string
        parent:
          type: string
        isDir:
          type: boolean
          const: false
        title:
          type: string
        album:
          type: string
        artist:
          type: string
        track:
          type: integer
        year:
          type: integer
        genre:
          type: string
        coverArt:
          type: string
        size:
          type: integer
          format: int64
        contentType:
          type: string
          examples:
          - audio/ogg
          - audio/mp4
        suffix:
          type: string
          examples:
          - opus
          - m4a
        duration:
          type: integer
          description: Seconds.
        bitRate:
          type: integer
          description: kbps.
        samplingRate:
          type: integer
        channelCount:
          type: integer
        path:
          type: string
          description: Relative to the library root.
        isVideo:
          type: boolean
          const: false
        playCount:
          type: integer
          format: int64
          description: Of the current user.
        discNumber:
          type: integer
        created:
          type: string
          format: date-time
        starred:
          type: string
          format: date-time
        played:
          type: string
          format: date-time
          description: '[OS] Last played by the current user.'
        albumId:
          type: string
        artistId:
          type: string
        type:
          type: string
          const: music
        mediaType:
          type: string
          const: song
        musicBrainzId:
          type: string
          description: '[OS] Recording MBID, empty when unknown.'
        genres:
          type: array
          items:
            $ref: '#/components/schemas/ItemGenre'
        artists:
          type: array
          items:
            $ref: '#/components/schemas/ArtistRef'
        displayArtist:
          type: string
        albumArtists:
          type: array
          items:
            $ref: '#/components/schemas/ArtistRef'
        displayAlbumArtist:
          type: string
        replayGain:
          $ref: '#/components/schemas/ReplayGain'
