            helpUrl: https://music.example.net/ut/docs/api-keys
    failed_invalidApiKey_xml:
      value: |
        <?xml version="1.0" encoding="UTF-8"?>
        <subsonic-response xmlns="http://subsonic.org/restapi" status="failed" version="1.16.1" type="UltimateTunes" serverVersion="0.1.0" openSubsonic="true">
          <error code="44" message="Invalid API key" helpUrl="https://music.example.net/ut/docs/api-keys"/>
        </subsonic-response>
    failed_wrongPassword:
      value:
        subsonic-response:
          status: failed
          version: 1.16.1
          type: UltimateTunes
          serverVersion: 0.1.0
          openSubsonic: true
          error:
            code: 40
            message: Wrong username or password
    failed_wrongPassword_xml:
      value: |
        <?xml version="1.0" encoding="UTF-8"?>
        <subsonic-response xmlns="http://subsonic.org/restapi" status="failed" version="1.16.1" type="UltimateTunes" serverVersion="0.1.0" openSubsonic="true">
          <error code="40" message="Wrong username or password"/>
        </subsonic-response>
    ping_ok:
      value:
        subsonic-response:
          status: ok
          version: 1.16.1
          type: UltimateTunes
          serverVersion: 0.1.0
          openSubsonic: true
    ping_ok_xml:
      value: |
        <?xml version="1.0" encoding="UTF-8"?>
        <subsonic-response xmlns="http://subsonic.org/restapi" status="ok" version="1.16.1" type="UltimateTunes" serverVersion="0.1.0" openSubsonic="true"/>
    getLicense_ok:
