openapi: 3.1.0
info:
  title: UltimateTunes OpenSubsonic subset
  version: 1.0.0
  description: |
    The subset of the [OpenSubsonic API](https://opensubsonic.netlify.app/) implemented by UltimateTunes
    (SPEC RF-02). Server-specific behaviour is described per operation. Ids follow `contracts/ids.md`, and
    errors follow `contracts/errors.md`.

    ## Endpoints and methods
    - Every endpoint is `/rest/<name>`. The legacy suffix `/rest/<name>.view` is accepted as an alias with
      identical behaviour (not listed separately).
    - `GET` with query parameters, or `POST` with an `application/x-www-form-urlencoded` body (`formPost`
      extension). With POST, all parameters, credentials included, go in the body. Repeatable parameters
      (`id`, `songId`, ...) are repeated keys.

    ## Authentication (in order of preference)
    1. `apiKey=<key>` (`apiKeyAuthentication` extension). Must not be combined with `u` (error 43), nor with
       `p`/`t`/`s` (error 43). An unknown or revoked key gives error 44.
    2. `u=<username>&p=<api key>` (or `p=enc:<hex of the key>`), for clients without the extension: the API key is
       accepted as the password. Account passwords are **not** accepted here (they are only for the admin panel
       and for creating keys).
    3. `u` + `t` + `s` (token auth): **refused with error 42**, since only Argon2id hashes are stored.
    No credentials gives error 10. `getOpenSubsonicExtensions` is public. Auth failures count towards the
    per-IP and per-key rate limit and lockout (HTTP 429).

    ## Response envelope
    Every non-binary response is a `subsonic-response` with `status` (`ok`/`failed`), `version` (`1.16.1`),
    `type` (`UltimateTunes`), `serverVersion` (the root `VERSION`, e.g. `0.1.0`) and `openSubsonic: true`.
    Failures add `error` (`code`, `message`, optional `helpUrl`) and use HTTP 200, except for the few statuses
    listed in `contracts/errors.md` (429 rate limit, 501 stubs, and 206/404/416/503 on `stream`/`download`).

    ## Unknown endpoints and HEAD
    - A `/rest/<name>` that is not in this file answers HTTP 200 with a failed envelope, error `0`, in the
      requested format (before authentication).
    - `HEAD` is accepted on `stream`, `download` and `getCoverArt`: same status and headers as `GET`, no body.

    ## XML mapping rule
    `f=xml` (the default when `f` is absent) returns `application/xml` (UTF-8) with the same element names as
    the JSON, following the Subsonic convention:
    - the root element is `<subsonic-response xmlns="http://subsonic.org/restapi" ...>`;
    - a JSON property whose value is a scalar (string, number, boolean) becomes an **attribute** of the
      element of its parent object (`true`/`false` for booleans);
    - a JSON property whose value is an object becomes a **child element** with the property name;
    - a JSON property whose value is an array becomes **repeated child elements** with the property name and no
      wrapper (`"song": [a, b]` gives `<song .../><song .../>`). Arrays of scalars give elements with text content
      (`<versions>1</versions>`);
    - exception: `line.value` (lyrics) is the **text content** of `<line>`, not an attribute;
    - empty arrays and absent or null properties produce nothing.
    The XML examples in this file are generated from the JSON examples with exactly this rule.

    ## Examples
    All artists, albums, songs and users in the examples are invented. They feed the Android fake server
    (`:core:api`) and schemathesis.
