  /ut/v1/search:
    get:
      operationId: search
      tags:
      - discovery
      summary: Search library and YouTube Music
      description: 'RF-03. Library results first, then external ones (`isExternal: true`), deduplicated (an archived
        video appears once, with its library id). External results are cached with a TTL. If YouTube Music fails,
        library results are still returned (no 502).'
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
        example: lanterns
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        description: Max items per type.
      - name: external
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: '`false`: library only.'
      responses:
        '200':
          description: Results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
              example:
                query: lanterns
                artists:
                - id: 0199d6a2-4c1e-7b3a-9f10-2a6c8e01a001
                  name: The Paper Lanterns
                  coverArt: ar-0199d6a2-4c1e-7b3a-9f10-2a6c8e01a001
                  isExternal: false
