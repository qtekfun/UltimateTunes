  /ut/v1/imports:
    get:
      operationId: listImports
      tags:
      - imports
      summary: Imports of the current user
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Newest first, without items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportList'
              example:
                imports:
                - id: 0199d6a2-4c1e-7b3a-9f10-2a6c8e017001
                  source: ytmusic
                  sourceUrl: https://music.youtube.com/playlist?list=PLx9Kd2Lm4Qp7Wz1Rt5Vb8Nc3Hy6Jf0Ga
                  name: Road Trip 2026
                  createdAt: '2026-10-12T08:00:00.000Z'
                  state: done
                  total: 3
                  matched: 2
                  notFound: 1
                  progress: 1
                  playlistId: 0199d6a2-4c1e-7b3a-9f10-2a6c8e01e001
                  error: null
                  updatedAt: '2026-10-12T08:01:12.000Z'
                  finishedAt: '2026-10-12T08:01:12.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: createImport
      tags:
      - imports
      summary: Import a playlist
      description: RF-08. Reads the playlist (a YouTube Music / YouTube URL as JSON, or an uploaded file as
        multipart), matches each track on YouTube Music, requests the matches and creates a user playlist. Runs
        in the background. Poll `GET /ut/v1/imports/{importId}`. Files are at most 1 MiB and 5000 rows, UTF-8
        (a BOM is accepted); larger files get `payload_too_large`, unreadable ones `invalid_parameter`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImport'
            example:
              url: https://music.youtube.com/playlist?list=PLx9Kd2Lm4Qp7Wz1Rt5Vb8Nc3Hy6Jf0Ga
              name: Road Trip 2026
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateFileImport'
            encoding:
              file:
                contentType: text/csv, application/json, text/plain
      responses:
        '202':
