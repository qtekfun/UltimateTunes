# Maintained by hand. Every example uses invented data only.
openapi: 3.1.0
info:
  title: UltimateTunes API
  version: 1.0.0
  description: |
    UltimateTunes' own API, used by the Android app next to the OpenSubsonic API (`/rest`). JSON only,
    `camelCase` properties, timestamps in ISO 8601 UTC, ids per `contracts/ids.md`.

    ## Authentication
    Send the API key in the **`X-Api-Key` header** (preferred). The `apiKey` query parameter is accepted as an
    equivalent for places where headers are awkward (it ends up in URLs, so avoid it). Sending both with different
    values gives `conflicting_auth`. Keys are created with `POST /ut/v1/keys` (username and password) or in the
    admin panel (QR code). `GET /ut/v1/server` and `POST /ut/v1/keys` need no key.

    ## Errors
    Every error is an RFC 9457 problem (`application/problem+json`) with a stable `code`. See
    `contracts/errors.md`. Rate-limited responses (429) carry `Retry-After`. Router stubs answer 501
    `not_implemented` until their PLAN task lands.

    ## Admin
    There are no admin JSON endpoints in v1. The admin panel is server-rendered HTML at `/admin` (RF-10).

    ## Examples
    All data in the examples is invented. The examples feed the Android fake server and schemathesis.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
- url: https://music.example.net
security:
- ApiKeyHeader: []
- ApiKeyQuery: []
tags:
- name: system
- name: keys
- name: tracks
- name: discovery
- name: imports
paths:
  /ut/v1/server:
    get:
      operationId: getServerInfo
      tags:
      - system
      summary: Server info and capabilities
      description: 'Public (no API key): the app calls it on the Connect screen to check the URL.'
      security: []
      responses:
        '200':
          description: Server info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
              example:
                name: UltimateTunes
                version: 0.1.0
                apiVersion: '1'
                openSubsonic:
                  apiVersion: 1.16.1
                  extensions:
                  - apiKeyAuthentication
                  - formPost
                  - songLyrics
                capabilities:
                  externalSearch: true
                  radio: true
                  charts: true
                  lyrics: true
                  youtubeMusicImport: true
                  fileImport: true
                  streamingWhileDownloading: true
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /ut/v1/me:
    get:
      operationId: getMe
      tags:
      - system
      summary: The authenticated user
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                id: 0199d6a2-4c1e-7b3a-9f10-2a6c8e01d001
                username: alice
                role: admin
                apiKeyId: 0199d6a2-4c1e-7b3a-9f10-2a6c8e01f001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /ut/v1/keys:
    get:
      operationId: listKeys
      tags:
      - keys
      summary: API keys of the current user
      responses:
        '200':
          description: Keys, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
              example:
                keys:
                - id: 0199d6a2-4c1e-7b3a-9f10-2a6c8e01f001
                  name: Pixel 9
                  prefix: utk_EXAMPLEe
                  createdAt: '2026-10-01T17:20:00.000Z'
                  lastUsedAt: '2026-10-12T08:15:30.123Z'
                  revokedAt: null
                  current: true
                - id: 0199d6a2-4c1e-7b3a-9f10-2a6c8e01f002
                  name: Old tablet
                  prefix: utk_3fT9aQ1z
                  createdAt: '2026-09-14T09:02:11.000Z'
                  lastUsedAt: '2026-09-30T21:44:05.000Z'
                  revokedAt: '2026-10-01T17:21:40.000Z'
                  current: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      operationId: createKey
      tags:
      - keys
      summary: Create an API key (needs the password)
      description: |-
        Creates a key for a new device (RF-01). Authenticates with **username and password** in the body, so a fresh install can get its first key. No API key is needed. If one is sent, it must belong to the same user (`conflicting_auth` otherwise).
        The full key is returned **once** in `secret`. Only its SHA-256 hash is stored. The response has `Cache-Control: no-store`. Failures count towards the per-IP and per-username lockout. A wrong password and an unknown user give the same `authentication_failed`.
      security:
      - {}
      - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
            example:
              username: alice
              password: correct horse battery staple
              name: Pixel 9
      responses:
        '201':
          description: 'Created. Store `secret` now: it is never shown again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedKey'
              example:
                key:
                  id: 0199d6a2-4c1e-7b3a-9f10-2a6c8e01f001
                  name: Pixel 9
                  prefix: utk_EXAMPLEe
                  createdAt: '2026-10-01T17:20:00.000Z'
                  lastUsedAt: null
                  revokedAt: null
                  current: false
                secret: utk_EXAMPLEexampleEXAMPLEexampleEXAMPLEexampleE
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /ut/v1/keys/{keyId}:
    delete:
      operationId: revokeKey
      tags:
      - keys
      summary: Revoke an API key
      description: 'Idempotent: revoking an already revoked key also returns 204. Revoking the key that makes the
        request is allowed (the app then disconnects). Admins revoke other users'' keys in `/admin`, not here.'
      parameters:
      - name: keyId
        in: path
        required: true
        schema:
          type: string
        example: 0199d6a2-4c1e-7b3a-9f10-2a6c8e01f002
      responses:
        '204':
          description: Revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /ut/v1/tracks/{id}/request:
    post:
      operationId: requestTrack
      tags:
      - tracks
      summary: Keep a track in the library
      description: 'RF-04. Materializes a `yt:` id (contracts/ids.md) and queues its download (deduplicated per
        video id). Also used by the app''s queue prefetch (`reason: prefetch`). For a track that is already `ready`,
        nothing is queued and the answer is 200. A `failed` or `cancelled` track is queued again (attempts reset).'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 80
        description: Library UUID or `yt:<videoId>` (contracts/ids.md).
        example: yt:Qx7Lm2pZ0aB
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestTrack'
            example:
              reason: prefetch
      responses:
        '200':
          description: Already in the library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackStatus'
              example:
                id: yt:Qx7Lm2pZ0aB
                trackId: 0199d6a2-4c1e-7b3a-9f10-2a6c8e01c005
                state: ready
                progress: 1
                attempts: 1
                maxAttempts: 3
                error: null
                streamable: true
                updatedAt: '2026-10-12T08:15:41.900Z'
        '202':
          description: Queued (or already queued or downloading).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackStatus'
              examples:
                queued:
                  value:
                    id: yt:Qx7Lm2pZ0aB
                    trackId: 0199d6a2-4c1e-7b3a-9f10-2a6c8e01c005
                    state: queued
                    progress: 0
                    attempts: 0
                    maxAttempts: 3
                    error: null
                    streamable: false
                    updatedAt: '2026-10-12T08:15:30.123Z'
                downloading:
                  value:
                    id: yt:Qx7Lm2pZ0aB
                    trackId: 0199d6a2-4c1e-7b3a-9f10-2a6c8e01c005
                    state: downloading
                    progress: 0.42
                    attempts: 1
                    maxAttempts: 3
                    error: null
                    streamable: true
                    updatedAt: '2026-10-12T08:15:30.123Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/Upstream'
  /ut/v1/tracks/{id}/status:
    get:
      operationId: getTrackStatus
      tags:
      - tracks
      summary: Download state of a track
      description: 'Poll (every 1–2 s while `queued`/`downloading`/`tagging`) to show progress and to learn the
        library id. A job failure is not an HTTP error: `state: failed` with `error`.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 80
        description: Library UUID or `yt:<videoId>` (contracts/ids.md).
        example: yt:Qx7Lm2pZ0aB
      responses:
        '200':
          description: Current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackStatus'
              examples:
                downloading:
                  value:
                    id: yt:Qx7Lm2pZ0aB
                    trackId: 0199d6a2-4c1e-7b3a-9f10-2a6c8e01c005
                    state: downloading
                    progress: 0.42
                    attempts: 1
                    maxAttempts: 3
                    error: null
                    streamable: true
                    updatedAt: '2026-10-12T08:15:30.123Z'
                ready:
                  value:
                    id: yt:Qx7Lm2pZ0aB
                    trackId: 0199d6a2-4c1e-7b3a-9f10-2a6c8e01c005
                    state: ready
                    progress: 1
                    attempts: 1
                    maxAttempts: 3
                    error: null
                    streamable: true
                    updatedAt: '2026-10-12T08:15:41.900Z'
                failed:
                  value:
                    id: yt:Rb4Tn8wKx1c
                    trackId: 0199d6a2-4c1e-7b3a-9f10-2a6c8e01c006
                    state: failed
                    progress: 0.1
                    attempts: 3
                    maxAttempts: 3
                    error:
                      code: video_unavailable
                      message: Video unavailable in this country
                    streamable: false
                    updatedAt: '2026-10-12T08:20:02.000Z'
                notRequested:
                  value:
                    id: yt:Rb4Tn8wKx1c
                    trackId: null
                    state: not_requested
                    progress: 0
                    attempts: 0
                    maxAttempts: 3
                    error: null
                    streamable: false
                    updatedAt: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /ut/v1/radio:
    get:
      operationId: getRadio
      tags:
      - discovery
      summary: Radio from a seed song
      description: 'RF-06. YouTube Music watch playlist for the seed, local-first: songs already archived come with
        their library ids. Same source as `/rest/getSimilarSongs2`.'
      parameters:
      - name: seed
        in: query
        required: true
        schema:
          type: string
          maxLength: 80
        description: Library UUID or `yt:` id of the seed song.
        example: 0199d6a2-4c1e-7b3a-9f10-2a6c8e01c001
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Radio queue (seed first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Radio'
              example:
