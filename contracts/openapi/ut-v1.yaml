  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: API key (`utk_…`). Preferred.
    ApiKeyQuery:
      type: apiKey
      in: query
      name: apiKey
      description: Same key as a query parameter. Equivalent to the header.
  responses:
    BadRequest:
      description: Invalid input (`missing_parameter`, `invalid_parameter`, `invalid_id`, `unsupported_url`, `conflicting_auth`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://github.com/qtekfun/UltimateTunes/blob/master/contracts/errors.md#invalid_id
            title: Invalid id
            status: 400
            detail: '''yt:abc'' is not a valid video id'
            code: invalid_id
            instance: /ut/v1/…
    Unauthorized:
      description: '`authentication_required`, `authentication_failed` or `invalid_api_key`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://github.com/qtekfun/UltimateTunes/blob/master/contracts/errors.md#invalid_api_key
            title: Invalid API key
            status: 401
            detail: The API key is unknown or revoked
            code: invalid_api_key
            instance: /ut/v1/…
    Forbidden:
      description: '`forbidden` or `account_disabled`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://github.com/qtekfun/UltimateTunes/blob/master/contracts/errors.md#forbidden
            title: Forbidden
            status: 403
            detail: Not allowed for this user
            code: forbidden
            instance: /ut/v1/…
    NotFound:
      description: '`not_found`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://github.com/qtekfun/UltimateTunes/blob/master/contracts/errors.md#not_found
            title: Not found
            status: 404
            detail: No such track
            code: not_found
            instance: /ut/v1/…
    Conflict:
      description: '`conflict` or `feature_disabled`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://github.com/qtekfun/UltimateTunes/blob/master/contracts/errors.md#feature_disabled
            title: Feature disabled
            status: 409
            detail: Spotify import is not configured on this server
            code: feature_disabled
            instance: /ut/v1/…
    TooLarge:
      description: '`payload_too_large`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://github.com/qtekfun/UltimateTunes/blob/master/contracts/errors.md#payload_too_large
            title: Payload too large
            status: 413
            detail: Body over 64 KiB
            code: payload_too_large
            instance: /ut/v1/…
    RateLimited:
      description: '`rate_limited` (rate limit or temporary lockout).'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://github.com/qtekfun/UltimateTunes/blob/master/contracts/errors.md#rate_limited
            title: Too many requests
            status: 429
            detail: Retry in 60 seconds
            code: rate_limited
            instance: /ut/v1/…
            retryAfter: 60
    Upstream:
      description: '`upstream_unavailable` (YouTube Music, Spotify, LRCLIB).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://github.com/qtekfun/UltimateTunes/blob/master/contracts/errors.md#upstream_unavailable
            title: Upstream unavailable
            status: 502
            detail: YouTube Music did not answer in time
            code: upstream_unavailable
            instance: /ut/v1/…
    NotImplemented:
      description: '`not_implemented` (router stubs of PLAN T02).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://github.com/qtekfun/UltimateTunes/blob/master/contracts/errors.md#not_implemented
            title: Not implemented
            status: 501
            detail: Not implemented yet
            code: not_implemented
            instance: /ut/v1/…
    Internal:
      description: '`internal_error`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://github.com/qtekfun/UltimateTunes/blob/master/contracts/errors.md#internal_error
            title: Internal error
            status: 500
            detail: Correlation id 7f3a9c2e
            code: internal_error
            instance: /ut/v1/…
  schemas:
    YoutubeCookiesStatus:
      type: object
      description: Non-secret status of the server-wide YouTube cookies (D14). Never carries a cookie value.
      required:
      - configured
      - available
      properties:
        configured:
          type: boolean
          description: Whether a YouTube session is stored.
        setAt:
          type: string
          nullable: true
          format: date-time
          description: When it was stored (UTC), or null.
        cookieCount:
          type: integer
          nullable: true
          description: How many cookies the stored file holds, or null.
        hasYoutubeDomain:
          type: boolean
          nullable: true
          description: Whether a youtube.com cookie is present, or null.
        available:
          type: boolean
          description: Whether the server has an encryption key (`UT_YTDLP_COOKIES_KEY`); false means the feature is off.
    Problem:
      type: object
      description: RFC 9457 problem details (`application/problem+json`). Clients switch on `code` only; the mapping
        from `TunesError` is in contracts/errors.md.
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri
          description: '`https://github.com/qtekfun/UltimateTunes/blob/master/contracts/errors.md#<code>`'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
          - missing_parameter
          - invalid_parameter
          - invalid_id
          - authentication_required
          - authentication_failed
          - conflicting_auth
          - invalid_api_key
          - account_disabled
          - forbidden
          - not_found
          - conflict
          - feature_disabled
          - unsupported_url
          - payload_too_large
          - rate_limited
          - upstream_unavailable
          - download_failed
          - not_implemented
          - internal_error
        retryAfter:
          type: integer
          minimum: 1
          description: Seconds, only with `rate_limited` (same as the `Retry-After` header).
    LibraryState:
      type:
      - string
      - 'null'
      enum:
      - pending
      - ready
      - failed
      - null
      description: 'State of the library track behind the item: `ready` (archived), `pending` (requested, downloading),
        `failed`. `null` for external items never requested.'
    TrackItem:
      type: object
      description: A song, from the library or from YouTube Music (`isExternal`).
      required:
      - id
      - title
      - artist
      - coverArt
      - isExternal
      - libraryState
      properties:
        id:
          type: string
          description: Library UUID, or `yt:<videoId>` while not archived.
        title:
          type: string
        artist:
          type: string
        artistId:
          type:
          - string
          - 'null'
          description: Library UUID or `ytartist:` id.
        album:
          type:
          - string
          - 'null'
        albumId:
          type:
          - string
          - 'null'
          description: Library UUID or `ytalbum:` id.
        durationSec:
          type:
          - integer
          - 'null'
          minimum: 0
        year:
          type:
          - integer
          - 'null'
        coverArt:
          type: string
          description: Cover art id for `/rest/getCoverArt`.
        isExternal:
          type: boolean
          description: True when the song is not archived in the library yet.
        libraryState:
          $ref: '#/components/schemas/LibraryState'
    AlbumItem:
      type: object
      required:
      - id
      - name
      - artist
      - coverArt
      - isExternal
      properties:
        id:
          type: string
        name:
          type: string
        artist:
          type: string
        artistId:
          type:
          - string
          - 'null'
        year:
          type:
          - integer
          - 'null'
        songCount:
          type:
          - integer
          - 'null'
          minimum: 0
        coverArt:
          type: string
        isExternal:
          type: boolean
    ArtistItem:
      type: object
      required:
      - id
      - name
      - coverArt
      - isExternal
      properties:
        id:
          type: string
        name:
          type: string
        coverArt:
          type: string
        isExternal:
          type: boolean
    ServerInfo:
      type: object
      required:
      - name
      - version
      - apiVersion
      - openSubsonic
      - capabilities
      properties:
        name:
          type: string
          const: UltimateTunes
        version:
          type: string
          description: Root `VERSION` file.
        apiVersion:
          type: string
          const: '1'
          description: Major version of this API (`/ut/v1`).
        openSubsonic:
          type: object
          required:
          - apiVersion
          - extensions
          properties:
            apiVersion:
              type: string
            extensions:
              type: array
              items:
                type: string
        capabilities:
          type: object
          description: Feature flags. The app hides what is false.
          required:
          - externalSearch
          - radio
          - charts
          - lyrics
          - youtubeMusicImport
          - fileImport
          - streamingWhileDownloading
          properties:
            externalSearch:
              type: boolean
            radio:
              type: boolean
            charts:
              type: boolean
              description: YouTube Music country charts (`/ut/v1/charts`) and moods (`/ut/v1/moods`)
                are available. Needs `radio` on.
            lyrics:
              type: boolean
            youtubeMusicImport:
              type: boolean
            fileImport:
              type: boolean
              description: Playlist import from an uploaded file (generic CSV, Exportify CSV, Spotify data-export
                JSON) is available (RF-08, SPEC §11 T03d).
            streamingWhileDownloading:
              type: boolean
    Me:
      type: object
      required:
      - id
      - username
      - role
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
          - admin
          - user
        apiKeyId:
          type: string
          description: Key used for this request.
    ApiKey:
      type: object
      required:
      - id
      - name
      - prefix
      - createdAt
      - lastUsedAt
      - revokedAt
      - current
      properties:
        id:
          type: string
        name:
          type: string
          description: Device name.
        prefix:
          type: string
          description: First 12 characters of the key, for recognising it.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
          - string
          - 'null'
          format: date-time
        revokedAt:
          type:
          - string
          - 'null'
          format: date-time
        current:
          type: boolean
          description: True for the key that made this request.
    ApiKeyList:
      type: object
      required:
      - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
          description: Newest first, revoked keys included.
    CreateKeyRequest:
      type: object
      required:
      - username
      - password
      - name
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Device name, e.g. `Pixel 9`.
        totp:
          type: string
          maxLength: 64
          format: password
          description: TOTP code or recovery code, required only when the account has two-factor authentication enabled.
    CreatedKey:
      type: object
      required:
      - key
      - secret
      properties:
        key:
          $ref: '#/components/schemas/ApiKey'
        secret:
          type: string
          pattern: ^utk_[A-Za-z0-9_-]{43}$
          description: The full API key. Shown **only in this response**, never again (only a hash is stored).
    TrackError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Worker error code (contracts/errors.md, worker table).
        message:
          type: string
    TrackStatus:
      type: object
      required:
      - id
      - trackId
      - state
      - progress
      - attempts
      - maxAttempts
      - error
      - streamable
      - updatedAt
      properties:
        id:
          type: string
          description: The id as requested (may be a `yt:` id).
        trackId:
          type:
          - string
          - 'null'
          description: Library UUID once the item is materialized. Clients should switch to it once `state` is `ready`
            (contracts/ids.md).
        state:
          type: string
          enum:
          - not_requested
          - queued
          - downloading
          - tagging
          - ready
          - failed
          - cancelled
          description: 'Job state (RF-04). `not_requested`: an external id nobody asked for yet. `cancelled`: an
            admin cancelled the job.'
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: Download progress (1 once ready).
        attempts:
          type: integer
          minimum: 0
        maxAttempts:
          type: integer
          minimum: 1
        error:
          oneOf:
          - $ref: '#/components/schemas/TrackError'
          - type: 'null'
          description: Last error, set when `failed` (or retrying).
        streamable:
          type: boolean
          description: '`/rest/stream` would start playing now (ready, or downloading with data in staging and a format
            that plays while it grows; otherwise only once the download is complete).'
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
    RequestTrack:
      type: object
      properties:
        reason:
          type: string
          enum:
          - keep
          - prefetch
          default: keep
          description: '`prefetch`: the next track of the play queue (higher priority than `keep`, lower than `stream`).'
    Radio:
      type: object
      required:
      - seed
      - items
      properties:
        seed:
          $ref: '#/components/schemas/TrackItem'
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackItem'
          description: Library items use library ids (local-first).
    Recommendations:
      type: object
      required:
      - recommendedForYou
      - becauseYouPlayed
      - shelves
      properties:
        recommendedForYou:
          type: array
          items:
            $ref: '#/components/schemas/TrackItem'
          maxItems: 50
          description: Songs the most seed-radios agree on, best first.
        becauseYouPlayed:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationShelf'
          maxItems: 10
          description: One shelf per seed (the seed song and the new songs of its radio).
        shelves:
          type: array
          items:
            $ref: '#/components/schemas/SourceShelf'
          maxItems: 20
          description: Shelves from external sources the admin switched on (empty by default).
    RecommendationShelf:
      type: object
      required:
      - seed
      - items
      properties:
        seed:
          $ref: '#/components/schemas/TrackItem'
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackItem'
          maxItems: 50
    SourceShelf:
      type: object
      description: A shelf from an external recommendation source (e.g. ListenBrainz).
      required:
      - source
      - title
      - items
      properties:
        source:
          type: string
          description: The source that produced the shelf, e.g. `listenbrainz`.
        title:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackItem'
          maxItems: 50
    Charts:
      type: object
      required:
      - country
      - items
      properties:
        country:
          type: string
          description: The country the chart is for (ISO 3166-1 alpha-2, `ZZ` = global).
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackItem'
          maxItems: 100
          description: Library items use library ids (local-first).
    Moods:
      type: object
      required:
      - categories
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/MoodCategory'
    MoodCategory:
      type: object
      required:
      - id
      - title
      properties:
        id:
          type: string
          description: The opaque category id to pass to `/ut/v1/moods/{moodId}`.
        title:
          type: string
    MoodTracks:
      type: object
      required:
      - id
      - items
      properties:
        id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackItem'
          maxItems: 100
          description: Library items use library ids (local-first).
    SearchResult:
      type: object
      required:
      - query
      - artists
      - albums
      - tracks
      properties:
        query:
          type: string
        artists:
          type: array
          items:
            $ref: '#/components/schemas/ArtistItem'
        albums:
          type: array
          items:
            $ref: '#/components/schemas/AlbumItem'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/TrackItem'
    CreateImport:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: 'Playlist URL. Allowed hosts: `music.youtube.com`, `www.youtube.com`, `youtube.com`, `m.youtube.com`
            (with `list=`). Anything else, Spotify URLs included (v1 imports Spotify playlists from files): `unsupported_url`.'
        name:
          type: string
          maxLength: 200
          description: 'Name of the resulting playlist (default: the source playlist''s name).'
    CreateFileImport:
      type: object
      required:
      - file
      - format
      properties:
        file:
          type: string
          format: binary
          description: The exported playlist, at most 1 MiB and 5000 rows, UTF-8.
        format:
          type: string
          enum:
          - csv
          - exportify_csv
          - spotify_json
          description: '`csv`: generic CSV with a header row and the columns `title`, `artist` (several joined
            with `;`), and optional `album`, `duration` (seconds or m:ss) and `isrc`. `exportify_csv`: the CSV
            Exportify writes. `spotify_json`: a playlist file from Spotify''s "Download your data" export.'
        name:
          type: string
          maxLength: 200
          description: 'Name of the resulting playlist (default: the name in the file, else the file name).'
    ImportItem:
      type: object
      required:
      - position
      - sourceTitle
      - state
      properties:
        position:
          type: integer
          minimum: 0
        sourceTitle:
          type: string
        sourceArtist:
          type:
          - string
          - 'null'
        sourceAlbum:
          type:
          - string
          - 'null'
        sourceDurationSec:
          type:
          - integer
          - 'null'
        state:
          type: string
          enum:
          - pending
          - matched
          - not_found
          - failed
        matchScore:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        track:
          oneOf:
          - $ref: '#/components/schemas/TrackItem'
          - type: 'null'
        error:
          type:
          - string
          - 'null'
    ImportSummary:
      type: object
      required:
      - id
      - source
      - sourceUrl
      - name
      - state
      - total
      - matched
      - notFound
      - progress
      - playlistId
      - error
      - createdAt
      - updatedAt
      - finishedAt
      properties:
        id:
          type: string
        source:
          type: string
          enum:
          - ytmusic
          - csv
          - exportify_csv
          - spotify_json
        sourceUrl:
          type:
          - string
          - 'null'
          description: The playlist URL for `ytmusic`; null for file imports.
        name:
          type:
          - string
          - 'null'
        state:
          type: string
          enum:
          - queued
          - reading
          - matching
          - done
          - failed
          description: '`done` once every item is matched or not found and the playlist exists. Track downloads
            continue in the background (see each track''s status).'
        total:
          type: integer
          minimum: 0
        matched:
          type: integer
          minimum: 0
        notFound:
          type: integer
          minimum: 0
        progress:
          type: number
          minimum: 0
          maximum: 1
        playlistId:
          type:
          - string
          - 'null'
          description: The user playlist created from the import.
        error:
          oneOf:
          - $ref: '#/components/schemas/TrackError'
          - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
    Import:
      allOf:
      - $ref: '#/components/schemas/ImportSummary'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ImportItem'
            description: Match report, in source order.
    ImportList:
      type: object
      required:
      - imports
      properties:
        imports:
          type: array
          items:
            $ref: '#/components/schemas/ImportSummary'
    RadioStation:
      type: object
      required:
      - seedId
      - title
      - coverArt
      properties:
        seedId:
          type: string
          description: Pass to `GET /ut/v1/radio?seed=`.
        title:
          type: string
        subtitle:
          type:
          - string
          - 'null'
        coverArt:
          type: string
    ListenNow:
      type: object
      required:
      - recentlyPlayed
      - recentlyAdded
      - mostPlayed
      - favouriteRadios
      properties:
        recentlyPlayed:
          type: array
          items:
            $ref: '#/components/schemas/AlbumItem'
          maxItems: 20
          description: Albums of the user's latest plays, most recent first.
        recentlyAdded:
          type: array
          items:
            $ref: '#/components/schemas/AlbumItem'
          maxItems: 20
        mostPlayed:
          type: array
          items:
            $ref: '#/components/schemas/TrackItem'
          maxItems: 20
        favouriteRadios:
          type: array
          items:
            $ref: '#/components/schemas/RadioStation'
          maxItems: 10
          description: Radios seeded from the user's starred songs.
