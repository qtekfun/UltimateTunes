<!-- The app's launcher icon (android/app/src/main/res/drawable/ic_launcher_{background,foreground}.xml)
     as the 72-unit square a launcher mask shows, in the 108-unit coordinates of the drawables:
     the pink-to-coral tile with its soft light, rounded like the store icon, and the white note. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72" width="72" height="72">
<defs>
<linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="18" y1="18" x2="90" y2="90"><stop offset="0" stop-color="#E0284F"/><stop offset="1" stop-color="#FF8A5C"/></linearGradient>
<radialGradient id="light" gradientUnits="userSpaceOnUse" cx="30" cy="24" r="62"><stop offset="0" stop-color="#FFF" stop-opacity="0.141"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></radialGradient>
<path id="shape" d="M32.5,18H75.5C82.5,18 90,25.5 90,32.5V75.5C90,82.5 82.5,90 75.5,90H32.5C25.5,90 18,82.5 18,75.5V32.5C18,25.5 25.5,18 32.5,18Z"/>
</defs>
<use href="#shape" fill="url(#tile)"/>
<use href="#shape" fill="url(#light)"/>
<path transform="translate(28.5 30.1) scale(2)" fill="#FFF" d="M14.88,15.6A4.3,3.15 -24 1,1 7.02,19.1A4.3,3.15 -24 1,1 14.88,15.6ZM13.1,3.6Q13.1,3 13.7,3H15.05V16.4H13.1ZM15.05,3C15.25,5.6 17.65,6.6 18.65,8.4C19.55,10 19.25,12.2 18.25,13.6C18.55,11.2 17.25,9.6 15.05,9.2Z"/>
