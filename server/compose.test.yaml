#
# Test stack: built from source, no persistent volumes, fake YouTube (never real downloads).
#   docker compose -f server/compose.test.yaml up --build --wait
# The api answers on http://localhost:8044 (the Android emulator reaches it at 10.0.2.2:8044).

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  # Bounds a fork bomb or a runaway tool (threads of the download tools count here too).
  pids_limit: 512

services:
  migrate:
    <<: *hardening
    build: &build
      context: ..
      dockerfile: server/Dockerfile
    image: ultimatetunes-server:test
    command: ["migrate"]
    volumes: [data:/data]

  api:
    <<: *hardening
    build: *build
    image: ultimatetunes-server:test
    command: ["api"]
    # As in compose.yaml: the api never runs anything from /tmp.
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: &test-env
      UT_LOG_LEVEL: DEBUG
      UT_FAKE_YOUTUBE: "true"
      # Test stack only: a fixed, public, worthless value so the worker can reach the internal
      # API. Never reuse it; real deployments pass a random token as a Docker secret (compose.yaml).
      UT_WORKER_TOKEN: test-stack-worker-token-not-a-secret
    # Only the client port is published; the worker reaches the internal API on api:8045.
    ports: ["127.0.0.1:8044:8044"]
    volumes: [data:/data, music:/music, staging:/staging]
    networks: [default, internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8044/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  worker:
    <<: *hardening
    build: *build
    image: ultimatetunes-server:test
    command: ["worker"]
    # Idle it runs no tool; a job adds yt-dlp (~65 MB) and, on the fallback client, a short-lived
    # Deno process (~330 MB) (spike T03c).
    mem_limit: 768m
    environment: *test-env
    depends_on:
      api:
        condition: service_healthy
    volumes: [music:/music, staging:/staging, ytdlp:/opt/ytdlp]
    networks: [internal]

networks:
  internal:
    internal: true

volumes:
  data:
  music:
  staging:
  ytdlp:
