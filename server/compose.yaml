#
# Example deployment (Docker Compose, one host). Copy it next to a `.env` file:
#   UT_VERSION=0.1.0                 image tag
#   UT_MUSIC_PATH=/srv/music         your library on the host
#   UT_BIND=127.0.0.1:8044           keep it local; publish it through `tailscale serve`
#   UT_TRUSTED_PROXIES=...           only behind a reverse proxy (deploy/README.md)
#   UT_INTERNAL_SUBNET=10.213.44.0/24 the api-worker network (change it if it overlaps yours)
#   UT_API_INTERNAL_ADDRESS=10.213.44.250 the api's pinned address on it (inside that subnet)
#   UT_EGRESS_SUBNET=10.213.45.0/24   the worker's way out (change it if it overlaps yours)
# and two fresh random secrets: ./secrets/worker_token and ./secrets/admin_session_secret
# (`openssl rand -hex 32` each; the worker token needs 32+ characters). Never reuse the test
# stack's token (compose.test.yaml) here.
#   docker compose up -d
# Public exposure: only through Caddy (deploy/README.md, "Exposing UltimateTunes"); never
# forward port 8044 on your router.
# Migrations run first (`migrate`), then the api. The worker never touches the database: it
# talks to the api's internal worker API (token-protected, api:8045 over `internal`) and leaves
# through its own `egress` network (yt-dlp, MusicBrainz, Cover Art Archive, GitHub releases).
# Only the api calls YouTube Music (music.youtube.com), through `default`.

x-hardening: &hardening
  image: ghcr.io/qtekfun/ultimatetunes-server:${UT_VERSION:?set UT_VERSION}
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  # Bounds a fork bomb or a runaway tool (threads of the download tools count here too).
  pids_limit: 512
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  migrate:
    <<: *hardening
    command: ["migrate"]
    restart: "no"
    volumes: [data:/data]

  api:
    <<: *hardening
    command: ["api"]
    # The api never runs anything from /tmp (only Python's spooled upload files may land
    # there): no exec, no setuid, and a size cap. The worker keeps the plain tmpfs of the
    # anchor: yt-dlp and Deno get their HOME/TMPDIR under it.
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    environment:
      # Behind `tailscale serve` or Caddy on the host, clients reach the api through Docker's
      # port publishing: set the proxy's address as the container sees it, the single bridge
      # gateway (e.g. 172.18.0.1/32, never a whole range: other containers could then claim
      # any client address), so `/admin`, `/readyz` and the per-IP limits see the real client.
      # Empty: no proxy is trusted and `/admin` refuses proxied requests (deploy/README.md).
      UT_TRUSTED_PROXIES: ${UT_TRUSTED_PROXIES:-}
      # The worker reaches the api only over `internal`: callers from there never get `/admin`
      # or the `/readyz` detail. Keep it equal to the subnet below.
      # Both of the worker's networks: `internal`, and `egress`, from which it could reach the
      # host's Caddy or a LAN-published UT_BIND (SECURITY.md: the gateway residual).
      UT_WORKER_NETWORKS: ${UT_INTERNAL_SUBNET:-10.213.44.0/24},${UT_EGRESS_SUBNET:-10.213.45.0/24}
      # Connection limits (settings.py): past UT_LIMIT_CONCURRENCY connections uvicorn answers
      # 503; idle keep-alive connections close after UT_KEEPALIVE_TIMEOUT_S.
      UT_LIMIT_CONCURRENCY: ${UT_LIMIT_CONCURRENCY:-128}
      UT_KEEPALIVE_TIMEOUT_S: ${UT_KEEPALIVE_TIMEOUT_S:-5}
      # The only host notification credentials go to (required with them; empty: none).
      UT_NOTIFY_HOST: ${UT_NOTIFY_HOST:-}
      # The internal worker API (8045) listens only on the api's pinned address on `internal`,
      # so nothing on the api's other networks (`default`, a reverse proxy's shared network)
      # can even connect to it. The client port (8044) still listens everywhere.
      UT_INTERNAL_HOST: ${UT_API_INTERNAL_ADDRESS:-10.213.44.250}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Idle about 60-120 MiB (docs/measurements.md); the rest bounds request bodies held at once
    # (UT_LIMIT_CONCURRENCY x at most 1-4 MiB) and SQLite's page cache.
    mem_limit: 768m
    cpus: 2.0
    ulimits:
      nofile: {soft: 4096, hard: 4096}
    # Only the client port is published. The internal worker API listens on 8045
    # (UT_INTERNAL_PORT), reachable from the worker over the Docker networks, never published.
    ports: ["${UT_BIND:-127.0.0.1:8044}:8044"]
    volumes:
      - data:/data
      - ${UT_MUSIC_PATH:?set UT_MUSIC_PATH}:/music
      - staging:/staging
    secrets:
      - source: worker_token
        # pydantic-settings reads /run/secrets/<env name>, prefix included.
        target: ut_worker_token
      - source: admin_session_secret
        # Signs admin panel sessions (32+ random characters); without it sessions die on restart.
        target: ut_admin_session_secret
      # First start only (optional): create ./secrets/bootstrap_admin_password, uncomment this
      # and the secret below, set UT_BOOTSTRAP_ADMIN_USERNAME, start once, then remove all three
      # and the file (the api warns while it is still set). Never put the password in .env.
      # - source: bootstrap_admin_password
      #   target: ut_bootstrap_admin_password
      # Optional: an ntfy access token for a notification server that requires login
      # (deploy/README.md, "Notifications with ntfy"). Uncomment with the secret below, and set
      # UT_NOTIFY_HOST in .env to the ntfy host name (required: the token goes only there).
      # - source: notify_token
      #   target: ut_notify_token
    networks:
      default: {}
      internal:
        # Pinned (UT_INTERNAL_HOST above). High in the subnet, away from the addresses Docker
        # hands out in order; keep it inside UT_INTERNAL_SUBNET.
        ipv4_address: ${UT_API_INTERNAL_ADDRESS:-10.213.44.250}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8044/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *hardening
    command: ["worker"]
    # Idle it runs no tool; a job adds yt-dlp (~65 MB) and, on the fallback client, a short-lived
    # Deno process (~330 MB) (spike T03c).
    mem_limit: 768m
    cpus: 2.0
    ulimits:
      nofile: {soft: 1024, hard: 1024}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ${UT_MUSIC_PATH:?set UT_MUSIC_PATH}:/music
      - staging:/staging
      - ytdlp:/opt/ytdlp
    environment:
      # The api's internal listener (UT_INTERNAL_PORT), not the client port. `api` resolves to
      # its address on `internal`, the only network the worker shares with it.
      UT_API_URL: http://api:8045
    secrets:
      - source: worker_token
        # pydantic-settings reads /run/secrets/<env name>, prefix included.
        target: ut_worker_token
    # `internal` reaches the api; `egress` is its own way out (yt-dlp to www.youtube.com,
    # MusicBrainz, Cover Art Archive, GitHub), so the worker shares no other network with the api.
    networks: [egress, internal]

secrets:
  worker_token:
    file: ./secrets/worker_token
  admin_session_secret:
    file: ./secrets/admin_session_secret
  # bootstrap_admin_password:
  #   file: ./secrets/bootstrap_admin_password
  # notify_token:
  #   file: ./secrets/notify_token

networks:
  internal:
    internal: true
    # Pinned so the api can refuse `/admin` to it (UT_WORKER_NETWORKS). Change it with
    # UT_INTERNAL_SUBNET if it overlaps one of your networks.
    ipam:
      config:
        - subnet: ${UT_INTERNAL_SUBNET:-10.213.44.0/24}
  egress:
    # Pinned so the api can refuse `/admin` to it too (UT_WORKER_NETWORKS): from here the worker
    # could reach the host (Caddy, a LAN-published UT_BIND). Block this bridge from your LAN on
    # the host firewall (deploy/README.md).
    ipam:
      config:
        - subnet: ${UT_EGRESS_SUBNET:-10.213.45.0/24}
    # A fixed interface name for those firewall rules.
    driver_opts:
      com.docker.network.bridge.name: ut-egress

volumes:
  data:
  staging:
  ytdlp:
