#
# Example deployment (Docker Compose, one host). Copy it next to a `.env` file:
#   UT_VERSION=0.1.0                 image tag
#   UT_MUSIC_PATH=/srv/music         your library on the host
#   UT_BIND=127.0.0.1:8044           keep it local; publish it through `tailscale serve`
#   UT_TRUSTED_PROXIES=...           only behind a reverse proxy (deploy/README.md)
#   UT_INTERNAL_SUBNET=10.213.44.0/24 the api-worker network (change it if it overlaps yours)
# and two random secrets: ./secrets/worker_token and ./secrets/admin_session_secret
# (e.g. `openssl rand -hex 32` each).
#   docker compose up -d
# Migrations run first (`migrate`), then the api. The worker never touches the database: it
# talks to the api's internal worker API (token-protected) and needs `default` to reach
# YouTube Music and MusicBrainz.

x-hardening: &hardening
  image: ghcr.io/qtekfun/ultimatetunes-server:${UT_VERSION:?set UT_VERSION}
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  # Bounds a fork bomb or a runaway tool (threads of the download tools count here too).
  pids_limit: 512
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  migrate:
    <<: *hardening
    command: ["migrate"]
    restart: "no"
    volumes: [data:/data]

  api:
    <<: *hardening
    command: ["api"]
    environment:
      # Behind `tailscale serve` or Caddy on the host, clients reach the api through Docker's
      # port publishing: set the proxy's address as the container sees it, the single bridge
      # gateway (e.g. 172.18.0.1/32, never a whole range: other containers could then claim
      # any client address), so `/admin`, `/readyz` and the per-IP limits see the real client.
      # Empty: no proxy is trusted and `/admin` refuses proxied requests (deploy/README.md).
      UT_TRUSTED_PROXIES: ${UT_TRUSTED_PROXIES:-}
      # The worker reaches the api only over `internal`: callers from there never get `/admin`
      # or the `/readyz` detail. Keep it equal to the subnet below.
      UT_WORKER_NETWORKS: ${UT_INTERNAL_SUBNET:-10.213.44.0/24}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Only the client port is published. The internal worker API listens on 8045
    # (UT_INTERNAL_PORT), reachable from the worker over the Docker networks, never published.
    ports: ["${UT_BIND:-127.0.0.1:8044}:8044"]
    volumes:
      - data:/data
      - ${UT_MUSIC_PATH:?set UT_MUSIC_PATH}:/music
      - staging:/staging
    secrets:
      - source: worker_token
        # pydantic-settings reads /run/secrets/<env name>, prefix included.
        target: ut_worker_token
      - source: admin_session_secret
        # Signs admin panel sessions (32+ random characters); without it sessions die on restart.
        target: ut_admin_session_secret
    networks: [default, internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8044/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *hardening
    command: ["worker"]
    # Idle it runs no tool; a job adds yt-dlp (~65 MB) and, on the fallback client, a short-lived
    # Deno process (~330 MB) (spike T03c).
    mem_limit: 768m
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ${UT_MUSIC_PATH:?set UT_MUSIC_PATH}:/music
      - staging:/staging
      - ytdlp:/opt/ytdlp
    environment:
      # The api's internal listener (UT_INTERNAL_PORT), not the client port.
      UT_API_URL: http://api:8045
    secrets:
      - source: worker_token
        # pydantic-settings reads /run/secrets/<env name>, prefix included.
        target: ut_worker_token
    # `internal` reaches the api; `egress` is its own way out to YouTube Music and MusicBrainz,
    # so the worker shares no other network with the api.
    networks: [egress, internal]

secrets:
  worker_token:
    file: ./secrets/worker_token
  admin_session_secret:
    file: ./secrets/admin_session_secret

networks:
  internal:
    internal: true
    # Pinned so the api can refuse `/admin` to it (UT_WORKER_NETWORKS). Change it with
    # UT_INTERNAL_SUBNET if it overlaps one of your networks.
    ipam:
      config:
        - subnet: ${UT_INTERNAL_SUBNET:-10.213.44.0/24}
  egress:

volumes:
  data:
  staging:
  ytdlp:
