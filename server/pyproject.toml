[project]
name = "ultimatetunes"
dynamic = ["version"]
description = "Self-hosted music streaming server with on-demand YouTube Music fetching"
license = "GPL-3.0-or-later"
requires-python = ">=3.13,<3.14"
dependencies = [
  "argon2-cffi>=25.1",
  # AEAD for the TOTP 2FA secret at rest (Fernet); Apache-2.0 OR BSD-3-Clause, manylinux wheels.
  "cryptography>=44.0",
  "fastapi>=0.115",
  "itsdangerous>=2.2",
  "jinja2>=3.1",
  "mutagen>=1.47",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  # Outbound HTTP (LRCLIB, MusicBrainz, Cover Art Archive, cover proxy; SPEC §6).
  "httpx>=0.28",
  "python-multipart>=0.0.20",
  "uvicorn>=0.34",
  # Runs in the api only (SPEC §11, T03b). yt-dlp is not a Python dependency: the worker runs
  # the official zipapp from /opt/ytdlp as a subprocess (SPEC §11, T03c).
  "ytmusicapi>=1.11",
]

[project.scripts]
ultimatetunes = "ultimatetunes.cli:main"

[dependency-groups]
dev = [
  "anyio>=4.8",
  "bandit>=1.8",
  "mypy>=1.15",
  "openapi-spec-validator>=0.7",
  "pip-audit>=2.8",
  # PostgreSQL driver for the portable-migration check in CI (approved 2026-10-12, T00);
  # runtime use comes in PLAN phase 5.
  "psycopg[binary]>=3.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "respx>=0.22",
  "ruff>=0.9",
  "schemathesis>=4.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# One version for everything: the root VERSION file (CLAUDE.md).
[tool.hatch.version]
path = "../VERSION"
pattern = "^(?P<version>\\d+\\.\\d+\\.\\d+(?:-rc\\.\\d+)?)\\s*$"

[tool.hatch.build.targets.wheel]
packages = ["src/ultimatetunes"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "S", "BLE",
  "T20", "PT", "RUF", "ASYNC", "TRY", "PL", "DTZ", "LOG", "G",
  # A directory without __init__.py is a namespace package that coverage.py never measures.
  "INP",
]
ignore = [
  # Exception messages are written inline; a custom class per message adds nothing.
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and fixed fake values by nature.
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
# Standalone scripts run by the Makefile, not a package.
"tools/**" = ["INP001"]

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]
mypy_path = ["src", "tools"]
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The quality-gate scripts of tools/ are tested too (tests/tools).
pythonpath = ["tools"]
addopts = [
  "--strict-markers",
  "--cov=ultimatetunes",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=xml:reports/coverage.xml",
]
markers = ["postgres: needs UT_TEST_POSTGRES_URL (a disposable PostgreSQL database)"]
filterwarnings = [
  "error",
  # Starlette's TestClient prefers httpx2; httpx is the approved client (SPEC §6).
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["ultimatetunes"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
