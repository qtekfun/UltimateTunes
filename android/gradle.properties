# Kept small on purpose (the author's machine runs other things): one daemon of 2 GB, the
# Kotlin compiler inside it instead of a second daemon, and at most two workers. Raise only
# when a build actually runs out of memory.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The app version is not here: it is the repository's VERSION file (see app/build.gradle.kts).
