# PRs are squash-merged, so the PR title becomes the commit that is read as the changelog entry to
# compute the next version and the CHANGELOG. It must be a Conventional Commit.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
          requireScope: false
          # Dependabot titles start with "Bump" and cannot be changed, so a capital is allowed.
          subjectPattern: ^[A-Za-z].+[^.]$
          subjectPatternError: >-
            The subject "{subject}" must start with a letter and not end with a period.
