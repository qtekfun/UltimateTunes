name: CI

on:
  pull_request:
    # "edited" too: changing a PR's base changes the range gitleaks scans.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts a PR touches, so the expensive jobs only run when they matter (Actions minutes).
  # A push to master runs everything. Plain git, no third-party action.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A title or body edit re-runs nothing; a base change re-runs everything (gitleaks range).
    if: github.event.action != 'edited' || github.event.changes.base != null
    outputs:
      server: ${{ steps.diff.outputs.server }}
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            echo "server=true" >> "$GITHUB_OUTPUT"; echo "android=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          printf '%s\n' "$files"
          # Shared files (workflows, tools, VERSION, .claude) run both sides.
          shared='^(\.github/|VERSION$|tools/|\.claude/|\.gitleaks)'
          if grep -qE "^(server/|contracts/|\.dockerignore$)|$shared" <<<"$files"; then s=true; else s=false; fi
          if grep -qE "^(android/|contracts/openapi/)|$shared" <<<"$files"; then a=true; else a=false; fi
          echo "server=$s" >> "$GITHUB_OUTPUT"; echo "android=$a" >> "$GITHUB_OUTPUT"

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: server

      # ffmpeg for the tagging golden tests (remux, ReplayGain; PLAN T09).
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install
        run: uv sync --locked

      # ruff, mypy, pytest with coverage thresholds, bandit, pip-audit (see server/Makefile).
      - name: Check
        run: make check

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-reports
          path: server/reports/
          retention-days: 14

  contracts:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    # The OpenAPI files validate, every migration applies on SQLite and on PostgreSQL
    # (portable SQL, SPEC §3), and the app answers its contracts (schemathesis).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ultimatetunes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: server

      - name: Contracts
        env:
          UT_TEST_POSTGRES_URL: postgresql://postgres:ci@localhost:5432/ultimatetunes
        run: |
          uv sync --locked
          make contracts

  android:
    # Dependabot PRs are built by dependabot-verification.yml, which first
    # refreshes android/gradle/verification-metadata.xml.
    needs: changes
    if: github.actor != 'dependabot[bot]' && needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check and build
        run: ./gradlew check assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/core/*/build/reports/
            android/build/reports/
          retention-days: 14

  docker:
    # Builds the image, scans it, and runs the test stack (fake YouTube) end to end.
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -f server/Dockerfile -t ultimatetunes-server:ci .

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ultimatetunes-server:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test the stack
        run: |
          docker compose -f server/compose.test.yaml up -d --wait
          curl -fsS http://localhost:8044/healthz
          curl -fsS http://localhost:8044/readyz
          docker compose -f server/compose.test.yaml down -v

  secrets:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # fetch-depth 0 fetches every branch, and gitleaks' default (`git log --all`) would scan them
      # all: one finding on any open branch would fail every PR. A PR scans its own commits
      # (base..head); a push to master scans master's whole history.
      - name: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            range="HEAD"
          fi
          echo "Scanning $range"
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="$range" --redact --verbose --exit-code 1

  store-texts:
    needs: changes
    # Store text limits on every PR; on a release PR (branch release/*), also requires the
    # en-US and es-ES changelogs for the versionCode of VERSION. See RELEASING.md.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the release tools
        run: tools/tests/run.sh

      - name: Check store texts
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == release/* ]]; then
            tools/check-store-texts.sh --release
          else
            tools/check-store-texts.sh
          fi
