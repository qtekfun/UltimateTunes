# Nightly and on demand:
# - canary (manual only): the only job allowed to reach YouTube Music. `ultimatetunes canary`
#   (PLAN T19) runs the catalog checks (search, radio, album page, playlist read) and downloads
#   one fixed Creative Commons track (docs/compat.md) with the current yt-dlp and ytmusicapi,
#   then deletes it. GitHub runner IPs get YouTube's bot wall (T03c), so the scheduled canary
#   runs on the server (reported in the admin panel) and this job is best effort.
# - audit: dependency vulnerabilities (server and image).
# - android-ui: instrumented tests on an emulator against the test stack (fake YouTube).
#   Also on PRs labelled `ui-tests`.
name: Nightly

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    # Manual only: GitHub runner IPs get YouTube's bot wall (T03c). The scheduled canary runs
    # on the server (worker), reported in the admin panel.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -f server/Dockerfile -t ultimatetunes-server:canary .

      # Same command as by hand on the server: yt-dlp is installed from the image's verified
      # seed into /opt/ytdlp, the track goes to /staging and is deleted. One JSON report per
      # side on stdout; the exit code is 1 when any check failed.
      - name: Canary
        run: docker run --rm --read-only --tmpfs /tmp --tmpfs /staging --tmpfs /opt/ytdlp ultimatetunes-server:canary canary

  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: server

      - name: pip-audit
        working-directory: server
        # Same flags as `make security` (the project itself is not on PyPI).
        run: uv sync --locked && uv run pip-audit --skip-editable

      - name: Build the image
        run: docker build -f server/Dockerfile -t ultimatetunes-server:audit .

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ultimatetunes-server:audit
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  android-ui:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ui-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Start the test stack (fake YouTube)
        run: docker compose -f server/compose.test.yaml up -d --build --wait

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator reaches the host's test stack at 10.0.2.2:8044 (debug builds only).
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.serverUrl=http://10.0.2.2:8044

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-ui-${{ matrix.api-level }}
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14
