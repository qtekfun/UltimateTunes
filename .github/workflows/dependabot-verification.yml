# Dependabot does not update android/gradle/verification-metadata.xml, so its PRs would
# always fail dependency verification. This workflow refreshes the checksums on
# the PR branch and then runs the same checks as ci.yml in strict mode.
#
# Limitation: a push made with GITHUB_TOKEN does not trigger new workflow runs,
# so the result of this run is the check to look at before merging.

name: Dependabot verification

on:
  pull_request:
    paths: ["android/**"]

permissions:
  contents: read

concurrency:
  group: dependabot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-and-check:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum. The cache stays disabled so
      # every artifact and metadata file is downloaded and recorded.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Refresh dependency checksums
        working-directory: android
        run: >-
          ./gradlew --write-verification-metadata sha256
          --no-build-cache --rerun-tasks --no-configuration-cache
          clean check assembleDebug assembleRelease

      - name: Commit refreshed checksums
        run: |
          if git diff --quiet -- android/gradle/verification-metadata.xml; then
            echo "Checksums already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/gradle/verification-metadata.xml
          git commit -m "build: refresh dependency verification metadata"
          git push

      - name: Check and build with strict verification
        working-directory: android
        run: ./gradlew check assembleDebug
