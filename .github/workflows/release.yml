# For a version tag (vX.Y.Z or vX.Y.Z-rc.N): builds the signed APK and the multi-arch server
# image, pushes the image to GHCR and publishes a GitHub Release with the notes of that version
# from CHANGELOG.md. See RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches VERSION
        id: v
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match VERSION $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-rc.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  apk:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check and build the signed APK
        working-directory: android
        env:
          UT_KEYSTORE_BASE64: ${{ secrets.UT_KEYSTORE_BASE64 }}
          UT_KEYSTORE_PASSWORD: ${{ secrets.UT_KEYSTORE_PASSWORD }}
          UT_KEY_ALIAS: ${{ secrets.UT_KEY_ALIAS }}
          UT_KEY_PASSWORD: ${{ secrets.UT_KEY_PASSWORD }}
        run: |
          test -n "$UT_KEYSTORE_BASE64" || { echo "Missing signing secrets"; exit 1; }
          export UT_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$UT_KEYSTORE_BASE64" | base64 -d > "$UT_KEYSTORE_FILE"
          ./gradlew check assembleRelease
          rm -f "$UT_KEYSTORE_FILE"

      - name: Name and hash the APK
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          apk="UltimateTunes-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: UltimateTunes-*.apk*
          retention-days: 7

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ultimatetunes-server
          # Release candidates never move `latest`.
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  publish:
    needs: [verify, apk, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > notes.md
          printf '\nServer image: `ghcr.io/%s/ultimatetunes-server:%s`\n' "$GITHUB_REPOSITORY_OWNER" "$VERSION" >> notes.md
          flag=""; [[ "$PRERELEASE" == "true" ]] && flag="--prerelease"
          gh release create "$GITHUB_REF_NAME" UltimateTunes-*.apk UltimateTunes-*.apk.sha256 \
            --title "UltimateTunes $VERSION" --notes-file notes.md $flag
