# EXAMPLE ONLY: Traefik's own stack, with the shared `proxy` network pinned so the api can
# trust exactly Traefik's address (UT_TRUSTED_PROXIES=10.213.46.2/32). Authelia (not shown)
# joins `proxy` too, reachable as http://authelia:9091.
#   docker compose -f compose.traefik.yaml up -d

services:
  traefik:
    image: traefik:v3.3.6
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
      # Only for the labels variant; a socket proxy (read-only) is the safer choice.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      proxy:
        ipv4_address: ${UT_TRAEFIK_ADDRESS:-10.213.46.2}

networks:
  proxy:
    name: proxy
    ipam:
      config:
        - subnet: ${UT_PROXY_SUBNET:-10.213.46.0/24}

volumes:
  letsencrypt:
