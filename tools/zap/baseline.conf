#
# ZAP baseline rule configuration for tools/zap-baseline.sh (tab-separated: rule id, action,
# name). Every rule not listed here keeps ZAP's default (WARN), and any WARN or FAIL fails the
# scan. Only list a rule with the reason it does not apply to this stack.
# Informational: the panel and landing page answer Cache-Control: no-store on purpose, and the
# two static files (CSS, vendored HTMX) are cacheable on purpose.
10049	IGNORE	(Non-Storable Content / Storable and Cacheable Content)
# Informational: the login form is a form login; nothing to fix.
10111	IGNORE	(Authentication Request Identified)
10112	IGNORE	(Session Management Response Identified)
# Informational: the panel uses HTMX (vendored, admin/static/htmx.min.js) for one refresh.
10109	IGNORE	(Modern Web Application)
# The vendored HTMX contains eval-capable code paths (hx-on, js: values); the panel uses none of
# them and the CSP (script-src 'self', no 'unsafe-eval') blocks eval in the browser.
10110	IGNORE	(Dangerous JS Functions)
